name: ZYP AAA Studio CI Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  zyp_review_gate:
    name: Local Review & Math Invariants
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy

    - name: Install AST-Grep (sg)
      run: |
        npm install -g @ast-grep/cli

    - name: Run ZYP Enclosure (cr_local_review)
      run: |
        # Make script executable
        chmod +x cr_local_review.sh
        # Run the gate (Will exit 1 if K(S) gate fails)
        bash cr_local_review.sh

    - name: Run Omega Feedback Loop (Distillation Harvester)
      run: |
        python scripts/distill_evidence.py

    - name: HALT_A4 Gate - Validate Shape Pairs Integrity
      run: |
        python3 -c "
import json, sys
with open('artifacts/shape_pairs.jsonl', 'r', encoding='utf-8') as f:
    for i, line in enumerate(f, 1):
        line = line.strip()
        if not line:
            continue
        try:
            pair = json.loads(line)
            dl = pair.get('delta_lambda_1', 0)
            if isinstance(dl, (int, float)) and dl < -0.001:
                print(f'HALT_A4: line {i} has delta_lambda_1={dl:.6f} < threshold')
                sys.exit(1)
        except json.JSONDecodeError as e:
            print(f'HALT_A4: line {i} invalid JSON: {e}')
            sys.exit(1)
print('HALT_A4 Gate: PASS - all shape pairs have delta_lambda_1 >= 0')
"
        
    - name: Upload Shape Pairs Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
      if: always()
      with:
        name: shape-pairs-distillation
        path: artifacts/shape_pairs.jsonl
        retention-days: 14
